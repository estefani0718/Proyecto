<dialog id="modal-categoria" class="form__dialog">
  <form id="form-categoria" class="form-doc">
    <h2 id="titulo-modal-categoria">Crear Categoría de Paquete</h2>

    <!-- Campo oculto para edición -->
    <input type="hidden" id="codigo_paquete">

    <!-- Campo Nombre de la Categoría -->
    <label class="caja__input">Nombre de la Categoría:</label>
    <input type="text" id="nombre_categoria" name="nombre_categoria" class="caja__input" maxlength="15" required>

    <div class="modal-botones">
      <button type="submit" class="Buton__entrar" id="btn_guardar_categoria">Guardar</button>
      <button type="button" class="Buton__entrar" id="btn_cancelar_categoria">Cancelar</button>
    </div>
  </form>
</dialog>
