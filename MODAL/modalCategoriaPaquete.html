<dialog id="modalCrearCategoriaPaquete">
  <form method="dialog" class="modal-content">
    <h3>Crear Categoría de Paquete</h3>

    <label for="nuevaCategoria">Nombre de Categoría:</label>
    <input type="text" id="nuevaCategoria" maxlength="15" required>

    <div class="botones">
      <button type="button" id="btnGuardarCategoria">Guardar</button>
      <button type="button" id="btnCerrarCrearCategoria">Cerrar</button>
    </div>
  </form>
</dialog>
<dialog id="modalActualizarCategoriaPaquete">
  <form method="dialog" class="modal-content">
    <h3>Actualizar Categoría</h3>

    <input type="hidden" id="idCategoriaActualizar">

    <label for="editarCategoria">Nombre de Categoría:</label>
    <input type="text" id="editarCategoria" maxlength="15" required>

    <div class="botones">
      <button type="button" id="btnActualizarCategoria">Guardar</button>
      <button type="button" id="btnCerrarActualizarCategoria">Cerrar</button>
    </div>
  </form>
</dialog>
