<dialog id="modal-factura" class="form__dialog">
  <form id="form-factura" class="form-doc">
    <h2>Registrar Factura</h2>

    <!-- codigo_factura oculto porque es auto_increment -->
    <input type="hidden" id="codigo_factura" name="codigo_factura">

    <label>Fecha Entrega:</label>
    <input type="text" id="fecha_entrega" name="fecha_entrega" maxlength="20" placeholder="YYYY-MM-DD" required>

    <label>Documento Usuario:</label>
    <input type="number" id="documento_usuario" name="documento_usuario" required>

    <label>Precio Total:</label>
    <input type="number" id="precio_total" name="precio_total" step="0.01" required>

    <label>Método de Pago:</label>
    <input type="text" id="metodo_pago" name="metodo_pago" maxlength="20" required>

    <label>Estado:</label>
    <select id="id_estado" name="id_estado" required>
      <option value="">Seleccione un estado</option>
      <option value="1">Activo</option>
      <option value="2">Cancelado</option>
      <option value="3">Pendiente</option>
    </select>

    <div class="modal-botones">
      <button type="submit" id="btn_guardar" class="Buton__entrar">Guardar</button>
      <button type="button" id="btn_cancelar" class="Buton__entrar">Cancelar</button>
    </div>
  </form>
</dialog>
