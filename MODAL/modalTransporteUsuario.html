<dialog id="modal-transporte-usuario" class="form__dialog">
  <form id="form-transporte-usuario" class="form-doc">
    <h2 id="titulo-modal-transporte-usuario">Registrar Transporte de Usuario</h2>

    <!-- Campo oculto para edición -->
    <input type="hidden" id="codigo_TransporteUsuario">

    <!-- Campo Placa -->
    <label class="caja__input">Placa del Vehículo:</label>
    <input type="text" id="placa" name="placa" class="caja__input" maxlength="8" required>

    <!-- Campo Documento Usuario -->
    <label class="caja__input">Documento del Usuario:</label>
    <input type="number" id="documento_usuario" name="documento_usuario" class="caja__input" required>

    <!-- Campo Años de Experiencia -->
    <label class="caja__input">Años de Experiencia:</label>
    <input type="number" id="anios_experiencia" name="anios_experiencia" class="caja__input" min="0" required>

    <!-- Campo Estado (puedes convertir esto en un select si tienes los nombres de los estados) -->
    <label class="caja__input">Estado:</label>
    <input type="number" id="id_estado" name="id_estado" class="caja__input" required>

    <div class="modal-botones">
      <button type="submit" class="Buton__entrar" id="btn_guardar_transporte_usuario">Guardar</button>
      <button type="button" class="Buton__entrar" id="btn_cancelar_transporte_usuario">Cancelar</button>
    </div>
  </form>
</dialog>
