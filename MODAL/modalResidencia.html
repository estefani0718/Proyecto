<dialog id="modal-residencia" class="form__dialog">
  <form id="form-residencia" class="form-doc">
    <h2 id="titulo-modal-residencia">Crear Residencia</h2>

    <!-- Campo oculto para edición -->
    <input type="hidden" id="codigo_residencia">

    <!-- Campo Nombre del Municipio -->
    <label class="caja__input">Nombre del Municipio:</label>
    <input type="text" id="nombre_municipio" name="nombre_municipio" class="caja__input" maxlength="20" required>

    <div class="modal-botones">
      <button type="submit" class="Buton__entrar" id="btn_guardar_residencia">Guardar</button>
      <button type="button" class="Buton__entrar" id="btn_cancelar_residencia">Cancelar</button>
    </div>
  </form>
</dialog>
