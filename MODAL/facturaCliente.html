<dialog id="modalFactura">
  <form method="dialog" class="modal-content">
    <h3>Factura de Entrega</h3>

    <label for="fechaEntrega">Fecha de entrega:</label>
    <input type="date" id="fechaEntrega" required>

    <label for="documentoUsuario">Documento del Usuario:</label>
    <input type="number" id="documentoUsuario" required>

    <label for="codigoTransporte">Código Transporte:</label>
    <input type="number" id="codigoTransporte" required>

    <label for="observaciones">Observaciones:</label>
    <input type="text" id="observaciones" maxlength="40">

    <label for="precioTotal">Precio Total:</label>
    <input type="number" id="precioTotal" step="0.01" required>

    <div class="botones">
      <button type="button" id="btnGuardarFactura">Guardar</button>
      <button type="button" id="cerrarModalFactura">Cerrar</button>
    </div>
  </form>
</dialog>
