
<dialog id="modal-rol" class="form__dialog">
  <form id="form-rol" class="form-doc">
    <h2 id="titulo-modal-rol">Crear Rol</h2>

    <!-- Campo oculto solo se usa para editar -->
    <input type="hidden" id="codigo_rol">

    <label class="caja__input">Nombre del rol:</label>
    <input type="text" id="rol" name="rol" class="caja__input" required>

    <div class="modal-botones">
      <button type="submit" class="Buton__entrar" id="btn-guardar-rol">Guardar</button>
      <button type="submit" id="btn-actualizar-rol">Actualizar</button>
      <button type="button" id="btn-cancelar-rol" class="Buton__entrar">Cancelar</button>
    </div>
  </form>
</dialog>
