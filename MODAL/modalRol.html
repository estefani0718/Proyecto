<dialog id="modalCrearRol">
  <form method="dialog" class="modal-content">
    <h3>Crear Rol</h3>

    <label for="nuevoRol">Nombre del Rol:</label>
    <input type="text" id="nuevoRol" maxlength="20" required>

    <div class="botones">
      <button type="button" id="btnGuardarRol">Guardar</button>
      <button type="button" id="btnCerrarCrearRol">Cerrar</button>
    </div>
  </form>
</dialog>
<dialog id="modalActualizarRol">
  <form method="dialog" class="modal-content">
    <h3>Actualizar Rol</h3>

    <input type="hidden" id="idRolActualizar">

    <label for="editarRol">Nombre del Rol:</label>
    <input type="text" id="editarRol" maxlength="20" required>

    <div class="botones">
      <button type="button" id="btnActualizarRol">Guardar</button>
      <button type="button" id="btnCerrarActualizarRol">Cerrar</button>
    </div>
  </form>
</dialog>
