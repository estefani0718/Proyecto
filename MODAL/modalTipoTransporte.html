<dialog id="modal-transporte" class="form__dialog">
  <form id="form-transporte" class="form-doc">
    <h2 id="titulo-modal" class="">Crear Tipo de Transporte</h2>

    <!-- Campo oculto si necesitas actualizar -->
    <input type="hidden" id="placa_original">

    <!-- Campo Placa -->
    <label class="caja__input">Placa:</label>
    <input type="text" id="placa" name="placa" class="caja__input" maxlength="8" required>

    <!-- Campo Nombre del Transporte -->
    <label class="caja__input">Nombre del Transporte:</label>
    <input type="text" id="nombre_transporte" name="nombre_transporte" class="caja__input" maxlength="8" required>

    <!-- Campo Modelo del Vehículo -->
    <label class="caja__input">Modelo del Vehículo:</label>
    <input type="text" id="modelo_vehiculo" name="modelo_vehiculo" class="caja__input" maxlength="20" required>

    <div class="modal-botones">
      <button type="submit" class="Buton__entrar" id="btn_guardar">Guardar</button>
      <button type="button" id="btn__cancelar" class="Buton__entrar">Cancelar</button>
    </div>
  </form>
</dialog>
