<dialog id="modal-tipo-paquete" class="form__dialog">
  <form id="form-tipo-paquete" class="form-doc">
    <h2 id="titulo-modal-tipo-paquete">Registrar Tipo de Paquete</h2>

    <!-- Campo oculto para edición -->
    <input type="hidden" id="codigo_Tpaquete">

    <!-- Nombre del Paquete -->
    <label class="caja__input">Nombre del Paquete:</label>
    <input type="text" id="nombre_paquete" name="nombre_paquete" class="caja__input" maxlength="30" required>

    <!-- Detalles Adicionales -->
    <label class="caja__input">Detalles Adicionales:</label>
    <input type="text" id="detalles_adicionales" name="detalles_adicionales" class="caja__input" maxlength="40">

    <!-- Código de Categoría (FK a CategoriaPaquete) -->
    <label class="caja__input">Categoría del Paquete (Código):</label>
    <input type="number" id="codigo_paquete" name="codigo_paquete" class="caja__input" required>

    <!-- Estado -->
    <label class="caja__input">Estado (ID):</label>
    <input type="number" id="id_estado" name="id_estado" class="caja__input" required>

    <!-- Origen -->
    <label class="caja__input">Origen:</label>
    <input type="text" id="origen" name="origen" class="caja__input" maxlength="30" required>

    <!-- Método de Pago -->
    <label class="caja__input">Método de Pago:</label>
    <input type="text" id="metodo_pago" name="metodo_pago" class="caja__input" maxlength="20" required>

    <!-- Destino -->
    <label class="caja__input">Destino:</label>
    <input type="text" id="destino" name="destino" class="caja__input" maxlength="30" required>

    <div class="modal-botones">
      <button type="submit" class="Buton__entrar" id="btn_guardar_tipo_paquete">Guardar</button>
      <button type="button" class="Buton__entrar" id="btn_cancelar_tipo_paquete">Cancelar</button>
    </div>
  </form>
</dialog>
