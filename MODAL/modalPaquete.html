<dialog id="modalEnviarPaquete" class="modal">
  <form method="dialog" class="modal-content">
    <h2>Enviar Detalles del Paquete</h2>

    <label for="nombrePaquete">Nombre del Paquete:</label>
    <input type="text" id="nombrePaquete" placeholder="Ej: Caja mediana" required />

    <label for="detallesPaquete">Detalles adicionales:</label>
    <textarea id="detallesPaquete" rows="3" placeholder="Ej: Frágil, entregar rápido..."></textarea>

    <label for="origen">Origen:</label>
    <input type="text" id="origen" placeholder="Ej: Calle 10 #12-34" required />

    <label for="destino">Destino:</label>
    <input type="text" id="destino" placeholder="Ej: Carrera 45 #22-11" required />

    <label for="valor">Valor del Paquete(un aproximado del pago):</label>
    <input type="number" id="valor" placeholder="Ej: 15000" required />

    <div class="modal-actions">
      <button id="btnEnviarPaquete">Enviar Paquete</button>
      <button onclick="document.getElementById('modalEnviarPaquete').close()">Cancelar</button>
    </div>
  </form>
</dialog>
