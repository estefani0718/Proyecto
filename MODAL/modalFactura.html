<dialog id="modal-factura" class="form__dialog">
  <form id="form-factura" class="form-doc">
    <h2 id="titulo-modal-factura">Registrar Factura</h2>

    <!-- Campo oculto para edición -->
    <input type="hidden" id="codigo_factura">

    <!-- Campo Fecha de Entrega -->
    <label class="caja__input">Fecha de Entrega:</label>
    <input type="text" id="fecha_entrega" name="fecha_entrega" class="caja__input" maxlength="20" required>

    <!-- Campo Documento Usuario -->
    <label class="caja__input">Documento del Usuario:</label>
    <input type="number" id="documento_usuario" name="documento_usuario" class="caja__input" required>

    <!-- Campo Observaciones -->
    <label class="caja__input">Observaciones:</label>
    <input type="text" id="observaciones" name="observaciones" class="caja__input" maxlength="40">

    <!-- Campo Valor del Paquete -->
    <label class="caja__input">Valor del Paquete:</label>
    <input type="number" step="0.01" id="valor_paquete" name="valor_paquete" class="caja__input" required>

    <!-- Campo Precio Total -->
    <label class="caja__input">Precio Total:</label>
    <input type="number" step="0.01" id="precio_total" name="precio_total" class="caja__input" required>

    <!-- Campo Estado -->
    <label class="caja__input">Estado:</label>
    <input type="number" id="id_estado" name="id_estado" class="caja__input" required>

    <div class="modal-botones">
      <button type="submit" class="Buton__entrar" id="btn_guardar_factura">Guardar</button>
      <button type="button" class="Buton__entrar" id="btn_cancelar_factura">Cancelar</button>
    </div>
  </form>
</dialog>
