<!-- Botón para abrir el modal -->
<button id="btnVerUsuario">Ver Usuario</button>

<!-- Modal -->
<dialog id="modalUsuario">
  <form method="dialog" class="modal-content">
    <h3>Información del Usuario</h3>

    <p><strong>Nombre:</strong> <span id="infoNombre"></span></p>
    <p><strong>Documento:</strong> <span id="infoDocumento"></span></p>
    <p><strong>Tipo de Documento:</strong> <span id="infoTipoDoc"></span></p>
    <p><strong>Género:</strong> <span id="infoGenero"></span></p>
    <p><strong>Dirección:</strong> <span id="infoDireccion"></span></p>
    <p><strong>Teléfono:</strong> <span id="infoTelefono"></span></p>
    <p><strong>Correo:</strong> <span id="infoCorreo"></span></p>
    <p><strong>Estado:</strong> <span id="infoEstado"></span></p>
    <p><strong>Rol:</strong> <span id="infoRol"></span></p>
    <p><strong>Residencia:</strong> <span id="infoResidencia"></span></p>

    <button id="cerrarModal" type="button">Cerrar</button>
  </form>
</dialog>
