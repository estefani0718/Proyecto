<dialog id="modalCrearEstado">
  <form method="dialog" class="modal-content">
    <h3>Crear Estado</h3>

    <label for="nuevoEstado">Nombre del Estado:</label>
    <input type="text" id="nuevoEstado" maxlength="50" required>

    <label for="nuevaEntidad">Nombre de la Entidad:</label>
    <input type="text" id="nuevaEntidad" maxlength="50" required>

    <div class="botones">
      <button type="button" id="btnGuardarEstado">Guardar</button>
      <button type="button" id="btnCerrarCrearEstado">Cerrar</button>
    </div>
  </form>
</dialog>
<dialog id="modalActualizarEstado">
  <form method="dialog" class="modal-content">
    <h3>Actualizar Estado</h3>

    <input type="hidden" id="idEstadoActualizar">

    <label for="editarEstado">Nombre del Estado:</label>
    <input type="text" id="editarEstado" maxlength="50" required>

    <label for="editarEntidad">Nombre de la Entidad:</label>
    <input type="text" id="editarEntidad" maxlength="50" required>

    <div class="botones">
      <button type="button" id="btnActualizarEstado">Guardar</button>
      <button type="button" id="btnCerrarActualizarEstado">Cerrar</button>
    </div>
  </form>
</dialog>
