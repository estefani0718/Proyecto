<dialog id="modal-estados" class="form__dialog">
  <form id="form-estados" class="form-doc">
    <h2 id="titulo-modal-estados">Crear Estado</h2>

    <!-- Campo oculto para edición -->
    <input type="hidden" id="id_estado">

    <!-- Campo Nombre del Estado -->
    <label class="caja__input">Nombre del Estado:</label>
    <input type="text" id="nombre_estado" name="nombre_estado" class="caja__input" maxlength="50" required>

    <!-- Campo Nombre de la Entidad -->
    <label class="caja__input">Nombre de la Entidad:</label>
    <input type="text" id="nombre_entidad" name="nombre_entidad" class="caja__input" maxlength="50" required>

    <div class="modal-botones">
      <button type="submit" class="Buton__entrar" id="btn_guardar_estado">Guardar</button>
      <button type="button" class="Buton__entrar" id="btn_cancelar_estado">Cancelar</button>
    </div>
  </form>
</dialog>
