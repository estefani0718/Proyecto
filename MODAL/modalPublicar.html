<dialog id="modalPublicarPedido" class="modal">
  <form method="dialog" class="modal-content">
    <h2>Publicar Pedido Urgente</h2>
    <label for="mensajePedido">¿Qué necesitas?</label>
    <textarea id="mensajePedido" rows="4" required placeholder="Necesito un domiciliario con urgencia..."></textarea>
    
    <div class="modal-actions">
      <button id="btnPublicarPedidoUrgente">Publicar</button>
      <button onclick="document.getElementById('modalPublicarPedido').close()">Cancelar</button>
    </div>
  </form>
</dialog>
