<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>
  <link rel="stylesheet" href="/CSS/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="shortcut icon" href="/IMG/Group 4.png" type="image/x-icon">

</head>

<body>
  <header class="header__formulario ">
    <div class="header__content">
      <div class="header__anterior">
        <a href="index.html" class="header__anterior-link">
          <i class="ri-arrow-left-fill"></i>
        </a>
        <p class="header__anterior-link__text">Atras</p>
      </div>
      <div class="header__content-icon">
        <img src="/IMG/Group 4.png" alt="icono">
      </div>
      <p class="header__icono-text">
        Rapido & altamente eficiente
      </p>
    </div>
  </header>

  <div class="contenedor__formulario">
     <div class="contendor__elements">
        <div class="element__circule">
          <img src="/IMG/Group 5.png" alt="circulo">
        </div>
        <div>
          <h2 class="formulario__title">DomiExpressPro</h2>
        </div>

        <div class="element__circule">
          <img src="/IMG/Group 5 (1).png" alt="">
        </div>
      </div>
    <form action="#" id="form__login" class="formulario__login">
       <div class="contendor__inputs ">
        <div >
          <label class="input__entrada">Usuario</label>
          <input type="text"  name="usuario"  class="caja__input" required>

        </div>
        <div >
          <label class="input__entrada"> Contraseña</label>
          <input type="password" name="contrasena" class="caja__input" required></input>
        </div>
      </div>
      <div class="contendor__inputs">
        <p>¿ No tienes cuenta ?</p>
        <a href="/HTML/registro.html" >Resgistrate aqui </a>
      </div>
      <div class="content__buton">
        <button  type="submit"   class="Buton__entrar">
          <a href="#">Entrar</a>
        </button>
      </div>
    </form>
  </div>
<script type="module" src="/JS/login.js"></script>
</body>
</html>
