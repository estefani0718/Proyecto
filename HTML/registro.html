<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse Usuario</title>
   <link rel="stylesheet" href="/CSS/style.css">
   <link rel="shortcut icon" href="/IMG/Group 4.png" type="image/x-icon">
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
</head>
<body>
  <header class="header__formulario  ">
    <div class="header__content">
      <div class="header__anterior">
        <a href="index.html" class="header__anterior-link">
          <i class="ri-arrow-left-fill"></i>
        </a>
        <p class="header__anterior-link__text">Atras</p>
      </div> 
      <div class="header__content-icon">
          <img src="/IMG/Group 4.png" alt="icono">
        </div>
      <p class="header__icono-text">
        Rapido & altamente eficiente 
      </p>
   </div>  
  </header>
  <div class="contenedor__registro">
    <div class="title"><h4 >Ingresa tus datos</h4></div>
   <!-- formulario de registro  -->
    <form action="#"  class="form__registro " id="form__registro" novalidate>
      <div class="contendor__inputs">
        <div>
          <label for="nombre" class="input__entrada">Nombre</label>
          <input type="text" class="caja__input" name="nombre" required>
        </div>
        <div>
          <select name="tipoDocumento" id=""  class="elemento__seleccion" required>
            <option>Tipo documento</option>
            <option value="1">Cedula ciudadania</option>
            <option value="2">Cedula extrajero</option>
            <option value="3">Nit</option>
          </select>
        </div>
        <div>
          <label for="documento" class="input__entrada">Documento</label>
          <input type="text" class="caja__input"  name="documento" required>
        </div>
      </div>
      <div  class="contendor__inputs radios">
        <label for="">Genero</label>
        <div><input type="radio" value="1" required name="genero"><label for="genero"> Masculino</label></div>
        <div><input type="radio" value="2" required name="genero"> <label for="genero">Femenino</label></div>
      </div>
      <div class="contendor__inputs">
        <div >
          <label for="direccion" class="input__entrada">Direccion</label>
          <input type="text" class="caja__input" name="direccion" required>
        </div>
        <div>
          <label for="telefono" class="input__entrada">Telefono</label>
          <input type="text" class="caja__input" name="telefono" required>
        </div>
      </div>
      <div class="contendor__inputs">
        <div >
          <label for="tipoTransporte" class="input__entrada">Tipo transporte</label>
          <input type="text" class="caja__input"name="tipoTransporte" required>
        </div>
        <div>
          <label for="email" class="input__entrada">E-mail</label>
          <input type="text" class="caja__input" name="email" required>
        </div>
        
      </div>
      <div class="contendor__inputs">
          <div>
            <label for="residencia" class="input__entrada">Municipio</label>
            <select name="residencia" id="" class="elemento__seleccion" required>
              <option value="1">Bucaramanga</option>
              <option value="2">Giron </option>
              <option value="3">Florida</option>
              <option value="4">Pidecuesta</option>
            </select>
        </div>
     </div>
      <div>
        <label for="" class="title">Crea un usuario y una contraseña </label>
        <div class="contendor__inputs">
          <div>
            <label for="usuario" class="input__entrada">Usuario</label>
            <input type="text"  name="usuario" class="caja__input">
          </div>
          <div>
            <label for="contraseña" class="input__entrada">Contraseña</label>
            <input type="text" name="contraseña" class="caja__input">
          </div>
        </div>
      </div>
     <div class="contendor__inputs">
      <label for="tipoCliente" class="input__entrada">Que tipo de cliente eres?</label>
      <select name="tipoCliente" id="" class="elemento__seleccion" required>
        <option value="1">Domiciliario</option>
        <option value="2">cliente</option>
      </select>
     </div>
      <div class="content__buton">
        <button class="Buton__entrar" type="submit">
          Registarse
        </button>
      </div>  
    </form>
    
  </div>
</body>
</html>

<script type="module" src="/JS/registro.js"></script>
